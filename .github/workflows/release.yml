name: Marketplace Release

on:
  workflow_dispatch:
    inputs:
      publish_to_marketplace:
        description: "Publish to JetBrains Marketplace (enable only after the initial manual upload)"
        required: true
        type: boolean
        default: false

concurrency:
  group: marketplace-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, Sign, and Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch sources
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^pluginVersion=//p' gradle.properties)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid pluginVersion: $VERSION"
            exit 1
          fi
          if ! grep -q "^## $VERSION$" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify signing secrets
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "$CERTIFICATE_CHAIN" || -z "$PRIVATE_KEY" ]]; then
            echo "Marketplace signing secrets are not configured."
            echo "Set CERTIFICATE_CHAIN and PRIVATE_KEY before running this workflow."
            exit 1
          fi

      - name: Verify Marketplace publishing token
        if: ${{ inputs.publish_to_marketplace }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$PUBLISH_TOKEN" ]]; then
            echo "PUBLISH_TOKEN is required when publishing to Marketplace."
            exit 1
          fi

      - name: Test and verify plugin
        run: ./gradlew test verifyPlugin --no-configuration-cache --console=plain

      - name: Build, sign, and verify plugin signature
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          # The signer password is optional for an unencrypted private.pem.
          if [[ -z "$PRIVATE_KEY_PASSWORD" ]]; then
            unset PRIVATE_KEY_PASSWORD
          fi
          ./gradlew buildPlugin signPlugin verifyPluginSignature --no-configuration-cache --console=plain

      - name: Locate signed distribution
        id: signed_zip
        shell: bash
        run: |
          shopt -s nullglob
          files=(plugin/build/distributions/*-signed.zip)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "Expected exactly one signed plugin ZIP; found ${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload signed plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          name: es-rest-data-source-${{ steps.version.outputs.value }}-signed
          path: ${{ steps.signed_zip.outputs.path }}
          if-no-files-found: error

      # Enable only after the plugin has been created by an initial manual Marketplace upload.
      - name: Publish to JetBrains Marketplace
        if: ${{ inputs.publish_to_marketplace }}
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$PRIVATE_KEY_PASSWORD" ]]; then
            unset PRIVATE_KEY_PASSWORD
          fi
          ./gradlew publishPlugin --no-configuration-cache --console=plain
